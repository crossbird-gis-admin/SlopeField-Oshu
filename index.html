<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奥州市傾斜計測アプリ（Cross Bird GIS）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; color: #222; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #5b4a2e; color: #fff; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  header button { padding: 5px 10px; border-radius: 6px; border: 0; background: #fff; color: #5b4a2e; font-size: 14px; cursor: pointer; }
  #status { font-size: 12px; opacity: .9; }
  #main { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; }
  #panel { width: 380px; overflow-y: auto; border-left: 1px solid #ddd; padding: 12px 14px; background: #fafafa; font-size: 14px; }
  #panel h2 { font-size: 15px; margin: 14px 0 8px; }
  .muted { color: #888; } .small { font-size: 12px; } .warn { color: #c62828; }
  a.act { color: #5b4a2e; cursor: pointer; text-decoration: underline; }
  .box { background: #fff; border: 1px solid #e3e3e3; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
  .box h3 { font-size: 13px; margin: 0 0 6px; color: #5b4a2e; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .btns button { flex: 1; min-width: 120px; padding: 7px; font-size: 13px; border: 1px solid #5b4a2e; border-radius: 6px; background: #fff; color: #5b4a2e; cursor: pointer; }
  .btns button.main { background: #5b4a2e; color: #fff; }
  .item { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; border-top: 1px solid #eee; font-size: 13px; }
  .item:first-of-type { border-top: 0; }
  .item .sw { width: 14px; height: 14px; border: 2px solid; border-radius: 3px; flex: none; margin-top: 3px; }
  .item .body { flex: 1; min-width: 0; word-break: break-all; }
  .item .x { color: #999; cursor: pointer; padding: 0 4px; }
  .item select { font-size: 12px; max-width: 150px; }
  .mcard { background: #fff; border: 1px solid #e3e3e3; border-left: 4px solid #00b8d4; border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; }
  .mcard.line { border-left-color: #ff4081; }
  .mcard .mt { display: flex; justify-content: space-between; gap: 6px; font-weight: 600; }
  .mcard .num { font-size: 13px; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .res table, .attr table { border-collapse: collapse; font-size: 13px; }
  .res th, .attr th { text-align: left; font-weight: 500; color: #555; padding: 2px 10px 2px 0; white-space: nowrap; vertical-align: top; }
  .res td { text-align: right; padding: 2px 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .res tr.sep th, .res tr.sep td { padding-top: 6px; }
  .res .big { font-size: 15px; font-weight: 700; }
  .attr td { padding: 2px 0; max-width: 200px; word-break: break-all; }
  .attr { max-height: 160px; overflow-y: auto; margin-bottom: 4px; }
  .bar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; margin: 5px 0 3px; border: 1px solid #ccc; }
  .bar span { display: block; height: 100%; }
  .cls { display: grid; grid-template-columns: auto 1fr auto; gap: 1px 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .cls i, .legend i, .cat i { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -1px; border: 1px solid #555; }
  .cls .p { text-align: right; }
  .prof { display: block; margin-top: 6px; }
  .legend { background: #fff; padding: 6px 9px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 12px; line-height: 1.6; max-height: 50vh; overflow-y: auto; }
  .cat { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; cursor: pointer; }
  .cat.off { opacity: .35; text-decoration: line-through; }
  .cat .n { color: #777; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lbl { background: none; border: 0; box-shadow: none; font-size: 11px; font-weight: 700; color: #222; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; text-align: center; white-space: nowrap; }
  label.chk { display: flex; gap: 6px; align-items: center; font-size: 13px; margin: 3px 0; cursor: pointer; }
  @media (max-width: 760px) {
    #main { flex-direction: column; }
    #panel { width: 100%; height: 45%; border-left: 0; border-top: 1px solid #ddd; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>奥州市傾斜計測アプリ（Cross Bird GIS）</h1>
    <span id="status"></span>
    <div class="tools">
      <button id="locate" title="現在地">現在地</button>
    </div>
  </header>
  <div id="main">
    <div id="map"></div>
    <aside id="panel"></aside>
  </div>
</div>
<input type="file" id="inDem" accept=".tif,.tiff,image/tiff" multiple style="display:none">
<input type="file" id="inVec" accept=".gpkg,.geojson,.json" multiple style="display:none">
<input type="file" id="inMeas" accept=".geojson,.json,application/geo+json" style="display:none">

<script>
// ===================== 設定(ここだけ編集すればOK) =====================
const CONFIG = {
  // 最初から読み込むDEM・レイヤ(このリポジトリに置いたもの)。ローカルのファイルだけで使うなら [] のまま
  // DEM。1mDEM(対象区画の周り20mだけ)を優先し、1mの無い所は5mDEM(5A、無い所は5B)で補う
  // どちらも平面直角X系(EPSG:6678)、標高はcm単位の整数。自分で読み込んだDEMがあれば、同じ解像度ならそちらが優先
  dems: [
    { url: 'data/dem1m_01.tif', name: '1m-01' },
    { url: 'data/dem1m_02.tif', name: '1m-02' },
    { url: 'data/dem1m_03.tif', name: '1m-03' },
    { url: 'data/dem1m_04.tif', name: '1m-04' },
    { url: 'data/dem1m_05.tif', name: '1m-05' },
    { url: 'data/dem1m_06.tif', name: '1m-06' },
    { url: 'data/dem1m_07.tif', name: '1m-07' },
    { url: 'data/dem1m_08.tif', name: '1m-08' },
    { url: 'data/dem1m_09.tif', name: '1m-09' },
    { url: 'data/dem1m_10.tif', name: '1m-10' },
    { url: 'data/dem1m_11.tif', name: '1m-11' },
    { url: 'data/dem1m_12.tif', name: '1m-12' },
    { url: 'data/dem1m_13.tif', name: '1m-13' },
    { url: 'data/dem1m_14.tif', name: '1m-14' },
    { url: 'data/oshu_5m_r1c1.tif', name: '5m(北西)' },
    { url: 'data/oshu_5m_r1c2.tif', name: '5m(北)' },
    { url: 'data/oshu_5m_r1c3.tif', name: '5m(北東)' },
    { url: 'data/oshu_5m_r2c1.tif', name: '5m(南西)' },
    { url: 'data/oshu_5m_r2c2.tif', name: '5m(南)' },
    { url: 'data/oshu_5m_r2c3.tif', name: '5m(南東)' },
  ],
  // 最初から表示するレイヤ。label=ラベルにする列、fill:false=塗りなし(線だけ。中をクリックすると地点の傾斜が見られる)、color=線の色
  // select:true = クリックで結果、Ctrl+クリックで選択できるレイヤ。compare = 既存の平均傾斜の列(frac=1/nのn、deg=度)
  // show:false = 最初は表示しない(右上のレイヤ切替で表示)
  layers: [
    { url: 'data/area.geojson', name: '対象区画', label: 'T2', colorField: 'T1', select: true, compare: { frac: '平均傾', deg: '平均_1' } },
    { url: 'data/rcom.geojson', name: '農業集落界', label: '集落名', fill: false, color: '#ffffff', weight: 1.5, show: false },
  ],
  geoName: '傾斜計測.geojson',           // 作業フォルダに保存する計測(続きから作業するときに読み込む方)
  csvName: '傾斜計測.csv',               // 同じ内容の表(Excel用。WKT列に形状)
  // 傾斜区分(度)。境界の値は上の区分に入る(3 → 「3〜8°」)
  slopeClasses: [3, 8, 15, 20, 30],
  classColors: ['#1a9850', '#91cf60', '#fee08b', '#fc8d59', '#d73027', '#7b3294'],
  // 中山間地域等直接支払の傾斜基準(目安の判定に使う)。田は勾配(高低差÷水平距離)、畑・草地は角度(度)
  chokubarai: { ta: { kyu: 1 / 20, kan: 1 / 100 }, hata: { kyu: 15, kan: 8 } },
  profileStep: 0.5,      // ラインの断面をとる間隔(m)
  gradWindow: 10,        // ラインの「最大勾配」を見る区間の長さ(m)。DEMの細かな凹凸を拾いすぎないため
  maxCells: 8e6,         // 1回の計算で読むDEMセル数の上限(1mなら約800ha)
  slopeMapMaxCells: 6e6, // 傾斜区分図を描くときに読むDEMセル数の上限
  slopeMapMinZoom: 14,   // このズーム以上で傾斜区分図を描く
  labelZoom: 15,         // このズーム以上でレイヤのラベルを表示
  layerColors: ['#ff9800', '#e040fb', '#76ff03', '#ff5252', '#40c4ff', '#ffd740'],
  colorFields: ['type', 'Type', 'TYPE', '種別', '区分', '用途', '作目', '地目', 'land_type'],
  categoryColors: { '田': '#1e88e5', '畑': '#8d6e63', '樹園地': '#7cb342', '草地': '#43a047', '100': '#1e88e5', '200': '#8d6e63' },
  palette: ['#00e5ff', '#e040fb', '#f44336', '#3f51b5', '#cddc39', '#ff80ab', '#795548', '#ffffff', '#009688', '#ffab40', '#b388ff', '#64dd17'],
  sqlWasm: 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.wasm',
};
// ======================================================================

const map = L.map('map', { maxZoom: 21 }).setView([39.15, 141.15], 11);
map.createPane('slopePane').style.zIndex = 350;
const gsi = '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>';
const bases = {
  '地理院 航空写真': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', { attribution: gsi, maxNativeZoom: 18, maxZoom: 21 }),
  '地理院 陰影起伏図': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/hillshademap/{z}/{x}/{y}.png', { attribution: gsi, maxNativeZoom: 16, maxZoom: 21 }),
  '地理院 傾斜量図': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/slopemap/{z}/{x}/{y}.png', { attribution: gsi, maxNativeZoom: 15, maxZoom: 21 }),
  '地理院 淡色地図': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', { attribution: gsi, maxNativeZoom: 18, maxZoom: 21 }),
  'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxNativeZoom: 19, maxZoom: 21 }),
};
bases['地理院 航空写真'].addTo(map);
L.control.scale({ imperial: false }).addTo(map);

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (v, d = 0) => Number(v).toLocaleString('ja-JP', { minimumFractionDigits: d, maximumFractionDigits: d });
const ok = v => typeof v === 'number' && Number.isFinite(v);
const r2 = (v, d = 2) => ok(v) ? +v.toFixed(d) : '';
const setStatus = t => document.getElementById('status').textContent = t;
const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
                set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} } };
const nowStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 19).replace('T', ' '); };
const baseName = n => n.replace(/\.[^.]+$/, '');

// ===================== 座標系 =====================
const CRS = {};
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI', 'XVII', 'XVIII', 'XIX'];
[[33, 129.5], [33, 131], [36, 132 + 1 / 6], [33, 133.5], [36, 134 + 1 / 3], [36, 136], [36, 137 + 1 / 6], [36, 138.5], [36, 139 + 5 / 6],
 [40, 140 + 5 / 6], [44, 140.25], [44, 142.25], [44, 144.25], [26, 142], [26, 127.5], [26, 124], [26, 131], [20, 136], [26, 154]]
  .forEach(([lat, lon], i) => {
    const def = `+proj=tmerc +lat_0=${lat} +lon_0=${lon} +k=0.9999 +x_0=0 +y_0=0 +ellps=GRS80 +units=m +no_defs`;
    CRS[6669 + i] = { def, label: `JGD2011 平面直角 ${ROMAN[i]}系` };
    CRS[2443 + i] = { def, label: `JGD2000 平面直角 ${ROMAN[i]}系` };
  });
for (let z = 51; z <= 55; z++) {
  CRS[6688 + z - 51] = { def: `+proj=utm +zone=${z} +ellps=GRS80 +units=m +no_defs`, label: `JGD2011 UTM ${z}N` };
  CRS[3097 + z - 51] = { def: `+proj=utm +zone=${z} +ellps=GRS80 +units=m +no_defs`, label: `JGD2000 UTM ${z}N` };
  CRS[32600 + z] = { def: `+proj=utm +zone=${z} +datum=WGS84 +units=m +no_defs`, label: `WGS84 UTM ${z}N` };
}
[[4326, 'WGS84 緯度経度'], [6668, 'JGD2011 緯度経度'], [4612, 'JGD2000 緯度経度']].forEach(([e, l]) => CRS[e] = { def: '+proj=longlat +ellps=GRS80 +no_defs', label: l, geo: true });
CRS[3857] = { def: 'EPSG:3857', label: 'Webメルカトル' };
const IDT = { forward: c => [c[0], c[1]], inverse: c => [c[0], c[1]] };
const trOf = epsg => CRS[epsg].geo ? IDT : proj4('EPSG:4326', CRS[epsg].def);
function askCrs(name, hint) {
  const v = (prompt(`「${name}」の座標系を判定できませんでした${hint ? `(コード ${hint})` : ''}。\nEPSGコード(例 6676)、または平面直角座標の系番号(1〜19、長野県は8)を入力してください`) || '').trim();
  if (!v) return 0;
  const n = parseInt(v, 10);
  const e = n >= 1 && n <= 19 ? 6668 + n : n;
  if (!CRS[e]) { alert(`EPSG:${e} には対応していません`); return 0; }
  return e;
}
const crsName = e => `${CRS[e].label}(EPSG:${e})`;

// ===================== DEM =====================
const dems = [];        // { name, from, img, ox, oy, dx, dy, W, H, nodata, epsg, tr, frame, bounds }
const demGroup = L.featureGroup().addTo(map);
async function addDem(src, name, from) {
  // cacheSize:読み込んだ64KBブロックを覚えておく数(既定100では、1mDEMの広い範囲を一度に読むと失敗することがある)
  const tiff = typeof src === 'string' ? await GeoTIFF.fromUrl(src, { cacheSize: 2000 }) : await GeoTIFF.fromBlob(src);
  const img = await tiff.getImage();
  const gk = img.getGeoKeys() || {};
  let epsg = gk.ProjectedCSTypeGeoKey || (gk.GTModelTypeGeoKey === 2 ? (gk.GeographicTypeGeoKey || 4326) : 0);
  if (!CRS[epsg]) { epsg = askCrs(name, epsg); if (!epsg) throw new Error('座標系が指定されませんでした'); }
  const [ox, oy] = img.getOrigin(), [rx, ry] = img.getResolution();
  const D = { name, from, img, url: typeof src === 'string' ? src : null, ox, oy, dx: rx, dy: Math.abs(ry), W: img.getWidth(), H: img.getHeight(), nodata: img.getGDALNoData(), epsg, tr: trOf(epsg) };
  // GDALのスケール・オフセット(標高をcm単位の整数で持つDEMなど)。値 = 生の値 × scale + offset
  const md = String(img.fileDirectory.GDAL_METADATA || '');
  const num = role => { const m = md.match(new RegExp(`<Item[^>]*role="${role}"[^>]*>\\s*([-+0-9.eE]+)\\s*<`)); return m ? +m[1] : NaN; };
  D.scale = Number.isFinite(num('scale')) ? num('scale') : 1; D.offset = Number.isFinite(num('offset')) ? num('offset') : 0;
  const xs = [ox, ox + D.W * D.dx], ys = [oy, oy - D.H * D.dy], ll = [];
  for (let k = 0; k <= 4; k++) ll.push([xs[0] + (xs[1] - xs[0]) * k / 4, ys[0]]);
  for (let k = 0; k <= 4; k++) ll.push([xs[1], ys[0] + (ys[1] - ys[0]) * k / 4]);
  for (let k = 0; k <= 4; k++) ll.push([xs[1] - (xs[1] - xs[0]) * k / 4, ys[1]]);
  for (let k = 0; k <= 4; k++) ll.push([xs[0], ys[1] - (ys[1] - ys[0]) * k / 4]);
  D.frame = L.polygon(ll.map(c => D.tr.inverse(c)).map(([x, y]) => [y, x]),
    { color: '#ffeb3b', weight: 2, dashArray: '6 6', fill: false, interactive: false });
  D.bounds = D.frame.getBounds();
  demGroup.addLayer(D.frame);
  dems.push(D);
  return D;
}
function removeDem(D) { demGroup.removeLayer(D.frame); dems.splice(dems.indexOf(D), 1); }
// 計算に使うDEM:自分で読み込んだものがあればそれだけ(設定で読み込んだサンプルより優先)
// 解像度(m)。1mと5mのDEMが重なるときは、細かい方を優先して使う
const resOf = D => metricCell(D, D.bounds.getCenter().lat)[0];
// 細かい順。同じ解像度なら、自分で読み込んだDEMを登録済みのDEMより先に
const fineFirst = ds => [...ds].sort((a, b) => (resOf(a) - resOf(b)) || ((a.from === 'config') - (b.from === 'config')));
// 1mを読み込んでも登録済みの5mは外さない(1mの穴は5mで補う)
function demsFor(b) {
  return fineFirst(dems.filter(D => D.bounds.intersects(b)));
}

const RAD = Math.PI / 180, GA = 6378137, GE2 = 0.00669438002290;
function metricCell(D, lat) {         // セルの大きさ(m)。緯度経度のDEMはその緯度でmに直す
  if (!CRS[D.epsg].geo) return [D.dx, D.dy];
  const s = Math.sin(lat * RAD), w = Math.sqrt(1 - GE2 * s * s);
  return [D.dx * RAD * GA / w * Math.cos(lat * RAD), D.dy * RAD * GA * (1 - GE2) / (w * w * w)];
}
// 経緯度の範囲 → DEMの座標系での範囲(辺を分割して変換)
function boxIn(D, w, s, e, n) {
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  for (let i = 0; i <= 4; i++) for (const [lng, lat] of [[w + (e - w) * i / 4, s], [w + (e - w) * i / 4, n], [w, s + (n - s) * i / 4], [e, s + (n - s) * i / 4]]) {
    const [x, y] = D.tr.forward([lng, lat]);
    minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y);
  }
  return [minx, miny, maxx, maxy];
}
// DEMの一部を読む(座標はDEMの座標系)。範囲外は NaN
async function readGrid(D, minx, miny, maxx, maxy, limit, pad = 2) {
  const c0 = Math.floor((minx - D.ox) / D.dx) - pad, c1 = Math.ceil((maxx - D.ox) / D.dx) + pad;
  const r0 = Math.floor((D.oy - maxy) / D.dy) - pad, r1 = Math.ceil((D.oy - miny) / D.dy) + pad;
  const cc0 = Math.max(c0, 0), cc1 = Math.min(c1, D.W), rr0 = Math.max(r0, 0), rr1 = Math.min(r1, D.H);
  if (cc1 <= cc0 || rr1 <= rr0) return null;
  if ((cc1 - cc0) * (rr1 - rr0) > limit) throw new Error('範囲が広すぎます。もう少し小さくしてください');
  const w = c1 - c0, h = r1 - r0, z = new Float32Array(w * h).fill(NaN);
  const [band] = await readWin(D, [cc0, rr0, cc1, rr1]);
  const ww = cc1 - cc0;
  for (let r = rr0; r < rr1; r++) for (let c = cc0; c < cc1; c++) {
    const v = band[(r - rr0) * ww + (c - cc0)];
    if (v === D.nodata || !Number.isFinite(v)) continue;

  const tr = measureTr(demsFor(L.latLngBounds([s, w], [n, e])), (s + n) / 2, (w + e) / 2);

    <path d="${path}" fill="none" stroke="#5b4a2e" stroke-width="1.6"/>${hl}
    <text x="${pl - 3}" y="${pt + 8}" text-anchor="end">${nf(z1, 1)}</text>
    <text x="${pl - 3}" y="${H - pb}" text-anchor="end">${nf(z0, 1)}</text>
    <text x="${pl}" y="${H - 6}">0</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">${nf(L0, 0)} m</text>
    <text x="${(pl + W) / 2}" y="${H - 6}" text-anchor="middle" fill="#e53935">${prof.gmax && ok(prof.gmax[0]) ? '赤:最大勾配の区間' : ''}</text>

const sm = { on: false, layer: null, opacity: 0.6, msg: '', timer: null, seq: 0 };
async function drawSlopeMap() {
  const my = ++sm.seq;
  const clear = msg => { if (sm.layer) { map.removeLayer(sm.layer); sm.layer = null; } sm.msg = msg; render(); };
  if (!sm.on) return clear('');
  if (!dems.length) return clear('DEMを読み込んでください');
  if (map.getZoom() < CONFIG.slopeMapMinZoom) return clear(`ズーム ${CONFIG.slopeMapMinZoom} 以上で表示します(今 ${map.getZoom()})`);
  const b = map.getBounds(), size = map.getSize(), k = Math.min(1, 1400 / Math.max(size.x, size.y));
  const W = Math.round(size.x * k), H = Math.round(size.y * k);
  // 粗いDEMから描き、細かいDEMで上書きする(1mの穴は5mで埋まる)
  const ds = demsFor(b).reverse();
  if (!ds.length) return clear('表示範囲にDEMがありません');
  sm.msg = '描いています…'; render();
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'), im = ctx.createImageData(W, H), px = im.data;
  const cols = CONFIG.classColors.map(hexRgb);
  let tooBig = false;
  for (const D of ds) {
    let G;
    try { G = await readGrid(D, ...boxIn(D, b.getWest(), b.getSouth(), b.getEast(), b.getNorth()), CONFIG.slopeMapMaxCells, 2); }
    catch { tooBig = true; continue; }
    if (my !== sm.seq) return;
    if (!G) continue;
    const [mx, myy] = metricCell(D, b.getCenter().lat), cls = new Uint8Array(G.w * G.h).fill(255);
    for (let r = 1; r < G.h - 1; r++) for (let c = 1; c < G.w - 1; c++) { const g = horn(G, r, c, mx, myy); if (g) cls[r * G.w + c] = classOf(slopeDeg(g[0], g[1])); }
    // 画面の点 → DEMのセル:16画素ごとに正確に変換し、その間は補間
    const S = 16, nx = Math.ceil(W / S) + 1, ny = Math.ceil(H / S) + 1, U = new Float64Array(nx * ny), V = new Float64Array(nx * ny);
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const ll = map.containerPointToLatLng([Math.min(i * S, W) / k, Math.min(j * S, H) / k]), [x, y] = D.tr.forward([ll.lng, ll.lat]);
      U[j * nx + i] = (x - D.ox) / D.dx - G.c0; V[j * nx + i] = (D.oy - y) / D.dy - G.r0;
    }
    for (let y = 0; y < H; y++) {
      const j = Math.min(ny - 2, Math.floor(y / S)), fy = (y - j * S) / S;
      for (let x = 0; x < W; x++) {
        const i = Math.min(nx - 2, Math.floor(x / S)), fx = (x - i * S) / S, q = j * nx + i;
        const u = (U[q] * (1 - fx) + U[q + 1] * fx) * (1 - fy) + (U[q + nx] * (1 - fx) + U[q + nx + 1] * fx) * fy;
        const v = (V[q] * (1 - fx) + V[q + 1] * fx) * (1 - fy) + (V[q + nx] * (1 - fx) + V[q + nx + 1] * fx) * fy;
        const c = Math.floor(u), r = Math.floor(v);
        if (c < 0 || r < 0 || c >= G.w || r >= G.h) continue;
        const cl = cls[r * G.w + c]; if (cl === 255) continue;
        const o = (y * W + x) * 4, rgb = cols[cl];
        px[o] = rgb[0]; px[o + 1] = rgb[1]; px[o + 2] = rgb[2]; px[o + 3] = 255;
      }
    }
  }
  if (my !== sm.seq) return;
  ctx.putImageData(im, 0, 0);
  if (sm.layer) map.removeLayer(sm.layer);
  sm.layer = L.imageOverlay(cv.toDataURL(), b, { opacity: sm.opacity, pane: 'slopePane', interactive: false }).addTo(map);
  sm.msg = tooBig ? '範囲が広すぎて描けないDEMがあります。拡大してください' : '';
  render();
}

const sorted = () => [...byMid.values()].sort((a, b) => a.created.localeCompare(b.created));

  features: sorted().map(l => ({ type: 'Feature', geometry: geomOf(l), properties: propsOf(l) })) });
const ringW = r => '(' + r.map(c => c.join(' ')).join(',') + ')';

}

const idb = (mode, val) => new Promise((res, rej) => {
  const o = indexedDB.open('slopefield', 1);
  o.onupgradeneeded = () => o.result.createObjectStore('kv');
  o.onerror = () => rej(o.error);
  o.onsuccess = () => {
    const st = o.result.transaction('kv', mode).objectStore('kv');
    const q = mode === 'readwrite' ? (val ? st.put(val, 'dir') : st.delete('dir')) : st.get('dir');
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  };
});

async function loadDir() {
  busy = true; clearFrom('folder');
  const files = [];
  for await (const h of dir.values()) if (h.kind === 'file') files.push(h);
  const errs = [];
  for (const h of files.filter(h => /\.tiff?$/i.test(h.name))) {

    try { await addDem(await h.getFile(), h.name, 'folder'); } catch (e) { errs.push(`${h.name}:${e.message}`); }
  }
  for (const h of files.filter(h => /\.(gpkg|geojson|json)$/i.test(h.name) && h.name !== CONFIG.geoName)) {
    setStatus(`レイヤを読み込み中… ${h.name}`);

  }

  busy = false;
  setStatus(`「${dir.name}」を開きました(DEM ${dems.filter(D => D.from === 'folder').length}・レイヤ ${vlayers.filter(V => V.from === 'folder').length}・計測 ${n} 件)`);

// 計測:同じ計測IDがあれば、更新日時の新しい方を残す
function merge(g) {
  const feats = (g.type === 'FeatureCollection' ? g.features : [g]).filter(f => isPolyG(f.geometry) || isLineG(f.geometry));
  let n = 0;
  feats.forEach(f => {
    const p = f.properties || {}, mid = p['計測ID'] || p.mid || '';
    const updated = String(p['更新日時'] || p['作成日時'] || '');
    const old = mid && byMid.get(mid);
    if (old && old.updated >= updated) return;
    if (old) removeMeasure(old);
    const res = {};
    Object.keys(p).forEach(k => { if (!META.includes(k)) res[k] = p[k]; });
    addMeasure(f.geometry, { mid: mid || undefined, name: p['名前'] || p.name || '', memo: p['メモ'] || p.memo || '',
      created: p['作成日時'] || p.created, updated, who: p['計測者'] || '', res: Object.keys(res).length ? res : null });
    n++;
  });
  return n;
}

  panel.scrollTop = scroll;
  on('dChoose', chooseDir); on('dReopen', reopenDir); on('dClose', closeDir);
  on('dReload', async () => { dirReady = true; await loadDir(); render(); });
  on('dlGeo', () => save(CONFIG.geoName.replace(/(\.\w+)$/, `_${nowStr().slice(0, 10)}$1`), JSON.stringify(toFC(), null, 1), 'application/geo+json'));
  on('dlCsv', () => save(CONFIG.csvName.replace(/(\.\w+)$/, `_${nowStr().slice(0, 10)}$1`), toCSV(), 'text/csv'));
  on('mOpen', () => $('inMeas').click()); on('addDem', () => $('inDem').click()); on('addVec', () => $('inVec').click());
  if ($('ptOn')) $('ptOn').onchange = e => { ptOn = e.target.checked; store.set('slope-pt', ptOn ? '1' : '0'); };
  if ($('smOn')) $('smOn').onchange = e => { sm.on = e.target.checked; drawLegend(); drawSlopeMap(); };
  if ($('smOp')) $('smOp').oninput = e => { sm.opacity = +e.target.value; if (sm.layer) sm.layer.setOpacity(sm.opacity); };
  on('clearAll', () => {
    if (!confirm('計測をすべて消します。' + (dir && dirReady ? '作業フォルダの計測ファイルも空になります。' : '') + 'よろしいですか?')) return;
    [...byMid.values()].forEach(removeMeasure); changed();
  });
  panel.querySelectorAll('[data-dem]').forEach(a => a.onclick = async () => {
    const D = dems[+a.dataset.dem];
    if (a.dataset.a === 'fit') map.fitBounds(D.bounds);
    if (a.dataset.a === 'rm') { removeDem(D); render(); drawSlopeMap(); }
  });
  panel.querySelectorAll('a[data-vec], span[data-vec]').forEach(a => a.onclick = () => {
    const V = vlayers[+a.dataset.vec], k = a.dataset.a;
    if (k === 'fit' && V.gl.getBounds().isValid()) { if (!map.hasLayer(V.gl)) V.gl.addTo(map); map.fitBounds(V.gl.getBounds(), { maxZoom: 17 }); }
    if (k === 'bulk') bulkCalc(V);
    if (k === 'csv' || k === 'geo') exportLayer(V, k);
    if (k === 'rm') { removeVector(V); render(); }
  });
  panel.querySelectorAll('select[data-vec]').forEach(s => s.onchange = () => {
    const V = vlayers[+s.dataset.vec];
    if (s.dataset.sel === 'color') { V.colorField = s.value; V.hidden.clear(); applyColors(V); render(); }
    else { V.labelField = s.value; drawLabels(V); }
  });
  panel.querySelectorAll('[data-catsel]').forEach(a => a.onclick = ev => {
    ev.stopPropagation(); const V = vlayers[+a.dataset.vec], k = a.dataset.catsel;
    setSel(V, V.fc.features.filter(f => catOf(V, f) === k), true);
  });
  panel.querySelectorAll('[data-sela]').forEach(a => a.onclick = () => {
    const V = vlayers[+a.dataset.vec], k = a.dataset.sela;
    if (k === 'all') setSel(V, visibleFs(V), true);
    if (k === 'view') { const b = map.getBounds(); setSel(V, visibleFs(V).filter(f => f._layer && b.contains(f._layer.getBounds().getCenter())), true); }
    if (k === 'clear') setSel(V, [...V.sel], false);
    if (k === 'fit' && V.sel.size) { const b = L.latLngBounds([]); V.sel.forEach(f => b.extend(f._layer.getBounds())); map.fitBounds(b, { maxZoom: 17, padding: [30, 30] }); }
    if (k === 'csv' || k === 'geo') exportSel(V, k);
  });
  panel.querySelectorAll('input[data-selmode]').forEach(c => c.onchange = e => { selMode = e.target.checked; store.set('slope-selmode', selMode ? '1' : '0'); render(); });
  panel.querySelectorAll('.cat[data-vec]').forEach(d => d.onclick = () => {
    const V = vlayers[+d.dataset.vec], k = d.dataset.cat;
    V.hidden.has(k) ? V.hidden.delete(k) : V.hidden.add(k);
    applyColors(V); drawLabels(V); render();
  });
  panel.querySelectorAll('.mcard [data-act]').forEach(a => a.onclick = () => {
    const l = byMid.get(a.closest('.mcard').dataset.mid); if (!l) return;
    const act = a.dataset.act;
    if (act === 'go') { map.fitBounds(l.getBounds(), { maxZoom: 18, padding: [40, 40] }); l.openPopup(); }
    if (act === 'name') rename(l);
    if (act === 'del' && confirm(`「${title(l)}」を削除しますか?`)) { removeMeasure(l); changed(); }
  });
}

layerCtl = L.control.layers(bases, { '計測': drawn, 'DEMの範囲': demGroup }).addTo(map);

// ===================== 起動 =====================
(async () => {
  render();
  for (const d of CONFIG.dems) try { await addDem(d.url, d.name, 'config'); } catch (e) { console.warn('DEM', d.url, e); }
  for (const v of CONFIG.layers) try {
    const r = await fetch(v.url); if (!r.ok) throw new Error(r.status);
    await addVectorFile(new File([await r.blob()], v.url.split('/').pop()), 'config', v.name, v);
  } catch (e) { console.warn('レイヤ', v.url, e); setStatus(`レイヤ ${v.url} を読み込めませんでした`); }
  try { const c = JSON.parse(store.get('slope-cache') || 'null'); if (c) merge(c); } catch {}
  if (FS) try {
    dir = (await idb('readonly')) || null;
    if (dir && (await dir.queryPermission({ mode: 'readwrite' })) === 'granted') { dirReady = true; await loadDir(); }
  } catch { dir = null; busy = false; }
  render();
  fitAll();
})();

let here = null;
document.getElementById('locate').onclick = () => map.locate({ setView: true, maxZoom: 18 });
map.on('locationfound', e => { if (here) here.remove(); here = L.circleMarker(e.latlng, { radius: 8, color: '#fff', weight: 2, fillColor: '#1e88e5', fillOpacity: 1 }).addTo(map); });
map.on('locationerror', () => alert('現在地を取得できませんでした(位置情報の許可を確認してください)'));
</script>
</body>
</html>
